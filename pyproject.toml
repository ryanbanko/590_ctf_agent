[project]
name = "ctf-agent"
version = "0.1.0"
description = "A small, isolated agent for the CTFTiny benchmarking assignment"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langfuse==5.1.0",
    "nyuctf==1.1.1",
    "openai==3.44.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = ["docker: synthetic checks that create Docker containers and networks"]
junit_family = "legacy"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
